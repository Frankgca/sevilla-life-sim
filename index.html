<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container { 
            width: 100%; max-width: 440px; background-color: #FDFBF7; 
            display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden;
        }
        
        /* PANTALLA DE REGISTRO (INALTERABLE) */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FDFBF7; z-index: 100; padding: 40px 20px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .form-card { 
            background: white; padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid #E5A54A; 
        }
        h1 { color: #C0392B; font-family: 'Montserrat', sans-serif; font-size: 2em; font-weight: 800; margin-bottom: 5px; text-align: center; letter-spacing: -0.5px; }
        .subtitle { color: #7f8c8d; font-size: 0.9em; margin-bottom: 25px; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.85em; color: #2c3e50; }
        input { width: 100%; padding: 12px; margin-top: 6px; border: 2px solid #ecf0f1; border-radius: 10px; font-size: 1em; }
        .start-btn { width: 100%; margin-top: 25px; padding: 14px; background: #C0392B; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1em; cursor: pointer; }

        /* PANTALLA DE JUEGO (CON LA BARRA ALBERO Y ESTILO LIMPIO) */
        header { 
            background: #ffffff; color: #2c3e50; padding: 20px; text-align: center; 
            border-top: 6px solid #E5A54A; box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
        }
        #player-name { font-family: 'Montserrat', sans-serif; font-size: 1.3em; font-weight: 700; margin-bottom: 4px; color: #C0392B; }
        #player-dni { font-size: 0.75em; background: #f4f6f7; display: inline-block; padding: 3px 10px; border-radius: 12px; color: #7f8c8d; font-family: monospace; letter-spacing: 0.5px; }
        .stats { margin-top: 12px; display: flex; justify-content: center; gap: 20px; font-size: 0.9em; font-weight: 600; color: #34495e; }
        
        #event-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #FDFBF7; }
        .log-entry { background: white; padding: 14px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); font-size: 0.95em; color: #333333; border-left: 4px solid #E5A54A; border-top: 1px solid #f1f1f1; }
        
        /* PANEL DE ACCIONES CON EL MISMO ESTILO LIMPIO */
        #actions-panel { padding: 16px; background: white; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 10px; }
        .action-row { display: flex; gap: 10px; }
        .action-btn { 
            flex: 1; padding: 14px; border: 2px solid #E5A54A; border-radius: 10px; 
            font-weight: 600; cursor: pointer; color: #2c3e50; background: #fffdf9; font-size: 0.95em; 
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover { background: #E5A54A; color: white; }
        
        .reset-btn { background: #f8f9fa; color: #7f8c8d; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 0.85em; font-weight: 600; cursor: pointer; }
        .reset-btn:hover { background: #e74c3c; color: white; border-color: #e74c3c; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- PANTALLA DE REGISTRO INTACTA -->
        <div id="start-screen">
            <div class="form-card">
                <h1>Sevillalife</h1>
                <p class="subtitle">Alta en el Padrón. Cuéntanos quién eres, mi arma.</p>
                <label>Nombre</label><input type="text" id="name-input" maxlength="15" placeholder="Curro">
                <label>Primer Apellido</label><input type="text" id="surname1-input" maxlength="15" placeholder="García">
                <label>Segundo Apellido</label><input type="text" id="surname2-input" maxlength="15" placeholder="Sevillano">
                <button class="start-btn" onclick="startGame()">Comenzar mi historia</button>
            </div>
        </div>

        <header>
            <div id="player-name">---</div>
            <div id="player-dni">DNI: ---</div>
            <div class="stats">
                <div>❤️ <span id="health-val">100</span>%</div>
                <div>😊 <span id="happiness-val">100</span>%</div>
            </div>
        </header>

        <main id="event-log"></main>

        <div id="actions-panel">
            <div class="action-row">
                <button class="action-btn" onclick="nextYear()">Cumplir año</button>
                <button class="action-btn" onclick="study()">Estudiar</button>
            </div>
            <div class="action-row">
                <button class="action-btn" onclick="searchJob()">Buscar trabajo</button>
            </div>
            <button class="reset-btn" onclick="resetGame()">Reiniciar partida</button>
        </div>
    </div>
    
    <script>
        let player = { name: "", dni: "", age: 0, health: 100, happiness: 100, logs: [] };

        function generateDNI() {
            let num = Math.floor(10000000 + Math.random() * 68999999);
            let letters = "TRWAGMYFPDXBNJZSQVHLCKE";
            return `${num}${letters.charAt(num % 23)}`;
        }

        function saveGame() { localStorage.setItem('sevillalife_save', JSON.stringify(player)); }

        function startGame() {
            let n = document.getElementById('name-input').value.trim();
            let s1 = document.getElementById('surname1-input').value.trim();
            let s2 = document.getElementById('surname2-input').value.trim();
            if (n === "" || s1 === "" || s2 === "") return alert("¡Rellena todo, mi arma!");
            player.name = `${n} ${s1} ${s2}`;
            player.dni = generateDNI();
            player.logs = ["Has nacido en Sevilla. ¡Bienvenido al mundo!"];
            saveGame();
            document.getElementById('start-screen').style.display = 'none';
            updateUI();
            renderLogs();
        }

        function updateUI() {
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-dni').innerText = `DNI: ${player.dni}`;
        }

        function renderLogs() {
            const eventLog = document.getElementById('event-log');
            eventLog.innerHTML = "";
            player.logs.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerText = msg;
                eventLog.appendChild(div);
            });
        }

        function addLog(text) {
            player.logs.unshift(`[${player.age} años] ${text}`);
            renderLogs(); 
            saveGame();
        }

        function nextYear() { player.age++; addLog(`Has cumplido ${player.age} años.`); }
        function study() { addLog(player.age < 6 ? `Eres un niño pequeño, ¡te faltan ${6 - player.age} años para estudiar!` : "Estás formándote para el futuro."); }
        function searchJob() { addLog(player.age < 16 ? `¡Aún eres menor de edad (${player.age} años)!` : "Has estado mirando ofertas de empleo."); }

        function resetGame() {
            if (confirm("¿Seguro que quieres reiniciar la partida?")) {
                localStorage.removeItem('sevillalife_save'); 
                location.reload();
            }
        }

        window.onload = () => {
            let s = localStorage.getItem('sevillalife_save');
            if (s) {
                player = JSON.parse(s);
                document.getElementById('start-screen').style.display = 'none';
                updateUI();
                renderLogs();
            }
        };
    </script>
</body>
</html>
