<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife</title>
    <style>
        body { margin: 0; background-color: #2c3e50; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* Contenedor que ocupa el 100% de la pantalla en móvil */
        #game-container { 
            width: 100%; max-width: 500px; height: 100vh; 
            background-color: #FDFBF7; display: flex; flex-direction: column; overflow: hidden;
        }
        
        .screen { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        #start-screen { justify-content: center; }
        #main-ui { display: none; } 
        
        .form-card { background: white; padding: 20px; border-radius: 15px; border-top: 5px solid #E5A54A; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        header { background: #C0392B; color: white; padding: 15px; text-align: center; }
        #event-log { flex: 1; overflow-y: auto; padding: 15px; }
        .log-entry { background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px; border-left: 4px solid #2980B9; font-size: 0.9em; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .controls { padding: 15px; border-top: 1px solid #eee; background: white; }
        button { width: 100%; padding: 14px; margin-top: 10px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="screen">
        <div class="form-card">
            <h1>Alta en el Padrón</h1>
            <input type="text" id="name-input" placeholder="Nombre">
            <input type="text" id="surname1-input" placeholder="1er Apellido">
            <input type="text" id="surname2-input" placeholder="2do Apellido">
            <p style="font-size:0.7em; color:gray;">* Los datos pueden ser ficticios.</p>
            <button onclick="startGame()" style="background:#C0392B; color:white;">Comenzar mi historia</button>
        </div>
    </div>

    <div id="main-ui" class="screen">
        <header>
            <h2 id="display-name" style="margin:0;">---</h2>
            <div id="display-dni" style="font-size:0.8em; opacity:0.9;">DNI: ---</div>
        </header>
        <div id="event-log"></div>
        <div class="controls">
            <button onclick="study()" style="background:#2980B9; color:white;">Estudiar</button>
            <button onclick="resetGame()" style="background:#ff7675; color:white;">Reiniciar partida</button>
        </div>
    </div>
</div>

<script>
    let player = { name: "", dni: "", age: 0, logs: [] };

    window.onload = () => {
        const saved = localStorage.getItem('sevillalife_data');
        if (saved) {
            player = JSON.parse(saved);
            renderGame();
        }
    };

    function startGame() {
        const n = document.getElementById('name-input').value.trim();
        const s1 = document.getElementById('surname1-input').value.trim();
        const s2 = document.getElementById('surname2-input').value.trim();
        
        if (!n || !s1 || !s2) return alert("Rellena todo, mi arma.");
        
        player.name = `${n} ${s1} ${s2}`;
        player.dni = Math.floor(Math.random()*100000000) + "TRWAGMYFPDXBNJZSQVHLCKE"[Math.floor(Math.random()*23)];
        player.logs = ["Has empezado tu vida en Sevilla."];
        
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('sevillalife_data', JSON.stringify(player));
        renderGame();
    }

    function renderGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('main-ui').style.display = 'flex';
        document.getElementById('display-name').innerText = player.name;
        document.getElementById('display-dni').innerText = "DNI: " + player.dni;
        
        const logDiv = document.getElementById('event-log');
        logDiv.innerHTML = player.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
    }

    function study() {
        player.logs.unshift("Estudias un poco más.");
        saveAndRefresh();
    }

    function resetGame() {
        localStorage.removeItem('sevillalife_data');
        location.reload();
    }
</script>
</body>
</html>
