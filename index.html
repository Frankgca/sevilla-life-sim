<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100dvh; }
        #game-container { width: 100%; max-width: 440px; background: #FDFBF7; height: 100dvh; display: flex; flex-direction: column; }
        .p-2 { padding: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #C0392B; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .log-entry { background: white; margin: 5px 0; padding: 10px; border-radius: 5px; border-left: 4px solid #E5A54A; font-size: 0.9em; }
        #event-log { flex-grow: 1; overflow-y: auto; padding: 10px; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen" class="p-2">
            <h1>Sevillalife</h1>
            <input type="text" id="n" placeholder="Nombre">
            <button onclick="startGame()">Comenzar</button>
            <button onclick="openModal()">Pegar código de partida</button>
        </div>
        
        <header class="p-2">
            <h2 id="display-name">---</h2>
            <p id="display-dni">DNI: ---</p>
            <p id="display-age">Edad: 0</p>
            <p>Salud: <span id="display-h">100</span>% | Felicidad: <span id="display-f">100</span>%</p>
        </header>
        <div id="event-log"></div>
        <div class="p-2">
            <button onclick="nextYear()">Pasar año</button>
            <button onclick="openModal()">Copiar código de partida</button>
        </div>

        <div id="modal" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); padding:20px;">
            <div style="background:white; padding:20px; border-radius:10px;">
                <h3>Código de Partida</h3>
                <textarea id="code-area" rows="4"></textarea>
                <button onclick="handleCode()">Aceptar</button>
                <button onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        // Objeto con todos los datos a exportar
        let player = { n: "", dni: "12345678A", a: 0, h: 100, f: 100, s: "Ninguno", j: "En paro", logs: [] };

        function updateUI() {
            document.getElementById('display-name').innerText = player.n;
            document.getElementById('display-dni').innerText = "DNI: " + player.dni;
            document.getElementById('display-age').innerText = "Edad: " + player.a;
            document.getElementById('display-h').innerText = player.h;
            document.getElementById('display-f').innerText = player.f;
            document.getElementById('event-log').innerHTML = player.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
        }

        function startGame() {
            player.n = document.getElementById('n').value;
            document.getElementById('start-screen').style.display = 'none';
            updateUI();
        }

        function nextYear() {
            player.a++;
            player.logs.unshift("Año " + player.a + " completado.");
            updateUI();
        }

        function openModal() {
            // Datos exportados: Nombre, DNI, Edad, Salud, Felicidad, Estudios, Trabajo
            const data = [player.n, player.dni, player.a, player.h, player.f, player.s, player.j];
            document.getElementById('code-area').value = btoa(JSON.stringify(data));
            document.getElementById('modal').style.display = 'block';
        }

        function handleCode() {
            try {
                const data = JSON.parse(atob(document.getElementById('code-area').value));
                player.n = data[0]; player.dni = data[1]; player.a = data[2];
                player.h = data[3]; player.f = data[4]; player.s = data[5]; player.j = data[6];
                player.logs = ["Partida cargada correctamente. Ya tienes los papeles en regla."];
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('modal').style.display = 'none';
                updateUI();
            } catch(e) { alert("Código no válido"); }
        }
    </script>
</body>
</html>
