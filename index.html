<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SevillLife: Edición Giralda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1e272e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            width: 100%;
            max-width: 440px;
            background-color: #f7f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-height: 900px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        @media (max-width: 440px) {
            #game-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }

        header {
            background: linear-gradient(135deg, #d35400, #e67e22);
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #game-brand {
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        header h1 {
            font-size: 1.4em;
            font-weight: 700;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            font-size: 0.95em;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.1);
            padding: 8px;
            border-radius: 8px;
        }

        .stats-extra {
            display: flex;
            justify-content: space-around;
            margin-top: 8px;
            font-size: 0.85em;
            color: #fdf2e9;
            font-weight: 600;
        }

        #event-log {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #edf2f4;
        }

        .log-entry {
            background-color: white;
            padding: 12px 15px;
            border-radius: 10px;
            border-left: 5px solid #d35400;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.95em;
            color: #2d3436;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-in;
        }

        #actions-panel {
            display: flex;
            gap: 10px;
            padding: 12px 15px;
            background-color: white;
            border-top: 1px solid #dfe6e9;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn:active {
            background-color: #74b9ff;
            transform: scale(0.98);
        }

        footer {
            padding: 15px;
            background-color: white;
            border-top: 1px solid #dfe6e9;
        }

        #age-btn {
            width: 100%;
            padding: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }

        #age-btn:active {
            background-color: #219a52;
            transform: scale(0.98);
        }

        #age-btn:disabled, .action-btn:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <div id="game-brand">SevillLife: Edición Giralda</div>
            <h1 id="player-name">Cargando...</h1>
            <div class="stats">
                <div class="stat-bar">❤️ <span id="health-val">100</span>%</div>
                <div class="stat-bar">😊 <span id="happiness-val">100</span>%</div>
                <div class="stat-bar">💶 <span id="money-val">0</span>€</div>
            </div>
            <div class="stats-extra">
                <div>📚 <span id="education-val">Ninguna</span></div>
                <div>💼 <span id="job-val">Desempleado</span></div>
            </div>
        </header>
        
        <main id="event-log"></main>

        <div id="actions-panel">
            <button id="study-btn" class="action-btn">Estudiar</button>
            <button id="job-btn" class="action-btn">Buscar Empleo</button>
        </div>

        <footer>
            <button id="age-btn">+ 1 Año</button>
        </footer>
    </div>

    <script>
        let player = {
            name: "",
            age: 0,
            health: 100,
            happiness: 100,
            money: 0,
            education: "Ninguna",
            job: "Desempleado",
            salary: 0,
            isAlive: true
        };

        const nameEl = document.getElementById('player-name');
        const healthEl = document.getElementById('health-val');
        const happinessEl = document.getElementById('happiness-val');
        const moneyEl = document.getElementById('money-val');
        const educationEl = document.getElementById('education-val');
        const jobEl = document.getElementById('job-val');
        const logEl = document.getElementById('event-log');
        const ageBtn = document.getElementById('age-btn');
        const studyBtn = document.getElementById('study-btn');
        const jobBtn = document.getElementById('job-btn');

        const randomEvents = [
            { text: "Llega agosto. Hace 45 grados a la sombra. Pierdes algo de salud por el calor extremo.", healthChange: -5, happinessChange: -10 },
            { text: "Te comes un buen serranito en un bar de Triana. ¡Qué maravilla!", healthChange: 2, happinessChange: 15 },
            { text: "Vas a la Feria de Abril. Te gastas un dineral en la calle del Infierno, pero te lo pasas genial.", moneyChange: -50, happinessChange: 20 },
            { text: "Te encuentras un gato callejero y decides adoptarlo. Lo llamas Dante. Tu felicidad aumenta al máximo.", happinessChange: 30 },
            { text: "Paseas por la orilla del Guadalquivir al atardecer. Te relajas muchísimo.", happinessChange: 10 }
        ];

        function initGame() {
            // Pedir nombre al iniciar
            let inputName = prompt("¿Cómo se llamará tu personaje?", "Frank");
            if (inputName && inputName.trim() !== "") {
                player.name = inputName.trim();
            } else {
                player.name = "Frank";
            }

            updateUI();
            addLog(`Has nacido en el hospital Virgen del Rocío, en Sevilla. Eres un bebé precioso.`);
        }

        function updateUI() {
            nameEl.innerText = `${player.name} - ${player.age} años`;
            healthEl.innerText = player.health;
            happinessEl.innerText = player.happiness;
            moneyEl.innerText = player.money;
            educationEl.innerText = player.education;
            jobEl.innerText = player.job;
        }

        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${player.age} años] ${message}`;
            logEl.prepend(entry);
        }

        function ageUp() {
            if (!player.isAlive) return;

            player.age += 1;
            
            if (player.salary > 0) {
                player.money += player.salary;
                addLog(`Has cobrado tu sueldo anual de ${player.salary}€.`);
            }

            if (Math.random() < 0.20 && player.age > 5) {
                triggerRandomEvent();
            }

            if (player.health <= 0 || (player.age > 80 && Math.random() < 0.1)) {
                player.isAlive = false;
                player.health = 0;
                addLog("Has fallecido. Fin de la partida.");
                ageBtn.disabled = true;
                studyBtn.disabled = true;
                jobBtn.disabled = true;
                ageBtn.style.backgroundColor = "gray";
            }

            updateUI();
        }

        function study() {
            if (!player.isAlive) return;

            if (player.age < 6) {
                addLog("Eres demasiado pequeño para ir al colegio.");
            } else if (player.age >= 6 && player.age <= 12 && player.education === "Ninguna") {
                player.education = "Primaria";
                addLog("Has empezado el colegio y te has sacado la Educación Primaria.");
            } else if (player.age >= 12 && player.education === "Primaria") {
                player.education = "Secundaria";
                addLog("Has terminado el instituto. Tienes el título de Secundaria.");
            } else if (player.age >= 18 && player.education === "Secundaria") {
                if (player.money >= 1500) {
                    player.money -= 1500;
                    player.education = "Universidad";
                    addLog("Has pagado 1500€ de matrícula y te has graduado en la Universidad de Sevilla.");
                } else {
                    addLog("La universidad cuesta 1500€. No tienes suficiente dinero.");
                }
            } else if (player.education === "Universidad") {
                addLog("Ya has alcanzado el máximo nivel educativo.");
            } else {
                addLog("Ya has estudiado todo lo correspondiente a tu edad. ¡Sigue creciendo!");
            }

            updateUI();
        }

        function applyJob() {
            if (!player.isAlive) return;

            if (player.age < 16) {
                addLog("Eres menor de edad, no puedes trabajar legalmente.");
                return;
            }

            if (player.education === "Universidad") {
                player.job = "Ingeniero/a";
                player.salary = 30000;
                addLog("¡Enhorabuena! Te han contratado en una empresa tecnológica de la Isla de la Cartuja. (Sueldo: 30.000€/año)");
            } else if (player.education === "Secundaria") {
                player.job = "Administrativo/a";
                player.salary = 15000;
                addLog("Has conseguido un trabajo de administrativo en una oficina en Los Remedios. (Sueldo: 15.000€/año)");
            } else {
                player.job = "Camarero/a";
                player.salary = 10000;
                addLog("Estás trabajando de camarero sirviendo tapas en el centro. (Sueldo: 10.000€/año)");
            }

            updateUI();
        }

        function triggerRandomEvent() {
            const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
            
            if (event.healthChange) player.health += event.healthChange;
            if (event.happinessChange) player.happiness += event.happinessChange;
            if (event.moneyChange) player.money += event.moneyChange;

            if (player.health > 100) player.health = 100;
            if (player.happiness > 100) player.happiness = 100;

            addLog(event.text);
        }

        ageBtn.addEventListener('click', ageUp);
        studyBtn.addEventListener('click', study);
        jobBtn.addEventListener('click', applyJob);

        initGame();
    </script>
</body>
</html>
