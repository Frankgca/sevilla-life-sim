<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sevillalife</title>
    <style>
        body { margin: 0; background-color: #2c3e50; font-family: sans-serif; display: flex; justify-content: center; }
        #game-container { width: 100%; max-width: 440px; background-color: #FDFBF7; height: 100vh; display: flex; flex-direction: column; }
        
        /* Pantallas */
        .screen { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        #start-screen { justify-content: center; }
        #main-ui { display: none; } /* Oculto por defecto */
        
        .form-card { background: white; padding: 20px; border-radius: 15px; border-top: 5px solid #E5A54A; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        header { background: #C0392B; color: white; padding: 20px; text-align: center; }
        #event-log { flex: 1; overflow-y: auto; padding: 10px; }
        .log-entry { background: #eee; padding: 10px; margin-bottom: 5px; border-radius: 5px; font-size: 0.9em; }
        .controls { padding: 10px; border-top: 1px solid #ccc; }
        button { width: 100%; padding: 12px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Pantalla Registro -->
    <div id="start-screen" class="screen">
        <div class="form-card">
            <h1>Alta en el Padrón</h1>
            <input type="text" id="name-input" placeholder="Nombre">
            <input type="text" id="surname1-input" placeholder="1er Apellido">
            <input type="text" id="surname2-input" placeholder="2do Apellido">
            <button onclick="startGame()">Comenzar mi historia</button>
        </div>
    </div>

    <!-- Pantalla Juego -->
    <div id="main-ui" class="screen">
        <header>
            <h2 id="display-name">---</h2>
            <div id="display-dni">DNI: ---</div>
        </header>
        <div id="event-log"></div>
        <div class="controls">
            <button onclick="study()">Estudiar</button>
            <button onclick="resetGame()" style="background:#ff7675;">Reiniciar partida</button>
        </div>
    </div>
</div>

<script>
    let player = { name: "", dni: "", age: 0, logs: [] };

    // 1. Carga al arrancar
    window.onload = () => {
        const saved = localStorage.getItem('sevillalife_data');
        if (saved) {
            player = JSON.parse(saved);
            renderGame();
        }
    };

    function startGame() {
        const n = document.getElementById('name-input').value.trim();
        const s1 = document.getElementById('surname1-input').value.trim();
        const s2 = document.getElementById('surname2-input').value.trim();
        
        if (!n || !s1 || !s2) return alert("Rellena todo, mi arma.");
        
        player.name = `${n} ${s1} ${s2}`;
        player.dni = Math.floor(Math.random()*100000000) + "TRWAGMYFPDXBNJZSQVHLCKE"[Math.floor(Math.random()*23)];
        player.logs = ["Has empezado tu vida en Sevilla."];
        
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('sevillalife_data', JSON.stringify(player));
        renderGame();
    }

    function renderGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('main-ui').style.display = 'flex';
        document.getElementById('display-name').innerText = player.name;
        document.getElementById('display-dni').innerText = "DNI: " + player.dni;
        
        const logDiv = document.getElementById('event-log');
        logDiv.innerHTML = player.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
    }

    function study() {
        player.logs.unshift("Estudias un poco más.");
        saveAndRefresh();
    }

    function resetGame() {
        localStorage.removeItem('sevillalife_data');
        location.reload();
    }
</script>
</body>
</html>
