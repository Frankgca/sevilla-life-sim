<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevillalife</title>
    <style>
        body {
            background-color: #FDFBF7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-top: 5px solid #C7812F;
            text-align: center;
        }

        .nombre {
            color: #A41623;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .info-personal {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-box {
            flex: 1;
            background: #F7F4EE;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: bold;
            color: #444;
            border: 1px solid #E6E0D4;
            text-align: center;
        }

        .barras-grid {
            display: flex;
            gap: 8px;
        }

        .barra-box {
            flex: 1;
            background: #F7F4EE;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: bold;
            border: 1px solid #E6E0D4;
            text-align: center;
        }

        .evento {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid #C7812F;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background-color: #D32F2F;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 2px 5px rgba(211,47,47,0.3);
        }

        .btn-reiniciar {
            background-color: white;
            color: #D32F2F;
            border: 2px solid #D32F2F;
            box-shadow: none;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75em;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="nombre">Jskskksksnss Ndkskkskskskks Jakskskkskskksk</div>
            <div class="info-personal">Edad: 0 años &nbsp;|&nbsp; DNI: 14334578N</div>
            
            <div class="stats-grid">
                <div class="stat-box">📚 Ninguno (Bebé)</div>
                <div class="stat-box">💼 En paro</div>
            </div>

            <div class="barras-grid">
                <div class="barra-box">❤️ Salud: 100%</div>
                <div class="barra-box">😊 Felicidad: 100%</div>
            </div>
        </div>

        <div class="evento">
            Has nacido en Sevilla. ¡Bienvenido al mundo! Tus padres te pasean en carrito por el Parque de María Luisa.
        </div>

        <button class="btn">Cumplir año</button>
        <button class="btn">Estudiar</button>
        <button class="btn">Buscar trabajo</button>
        <button class="btn btn-reiniciar">Reiniciar partida</button>

        <footer>
            © 2026 Frank. Todos los derechos reservados.
        </footer>
    </div>

</body>
</html>
