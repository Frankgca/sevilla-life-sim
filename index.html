<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife - Sede Electrónica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container { 
            width: 100%; max-width: 440px; background-color: #ffffff; 
            display: flex; flex-direction: column; height: 100vh; border-left: 1px solid #ddd; border-right: 1px solid #ddd;
        }
        
        /* PANTALLA DE REGISTRO */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #ffffff; z-index: 100; padding: 40px 20px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .form-card { 
            background: white; padding: 25px; border-radius: 4px; 
            border: 1px solid #ccc; border-top: 4px solid #E5A54A; 
        }
        h1 { color: #2c3e50; font-size: 1.5em; margin-bottom: 20px; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.85em; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 2px; }
        .start-btn { width: 100%; margin-top: 25px; padding: 12px; background: #2c3e50; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* PANTALLA DE JUEGO */
        header { background: #f8f9fa; color: #333; padding: 20px; text-align: center; border-bottom: 2px solid #E5A54A; }
        #player-name { font-size: 1.2em; font-weight: 700; }
        #player-dni { font-size: 0.8em; color: #666; margin-top: 5px; }
        .stats { margin-top: 15px; display: flex; justify-content: center; gap: 20px; font-size: 0.9em; }
        
        #event-log { flex-grow: 1; padding: 20px; overflow-y: auto; background: #fafafa; }
        .log-entry { 
            background: white; padding: 10px; border-bottom: 1px solid #eee; 
            font-size: 0.9em; color: #444; margin-bottom: 5px;
        }
        
        /* BOTONES INSTITUCIONALES */
        #actions-panel { padding: 15px; background: white; border-top: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .action-row { display: flex; gap: 10px; }
        .action-btn { 
            flex: 1; padding: 10px; border: 1px solid #2c3e50; background: white; 
            color: #2c3e50; cursor: pointer; font-size: 0.9em; font-weight: 600;
        }
        .action-btn:hover { background: #2c3e50; color: white; }
        .reset-btn { background: #fdfdfd; border: 1px solid #ccc; color: #888; padding: 8px; font-size: 0.75em; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <div class="form-card">
                <h1>Registro Civil</h1>
                <label>Nombre</label><input type="text" id="name-input" maxlength="15">
                <label>Primer Apellido</label><input type="text" id="surname1-input" maxlength="15">
                <label>Segundo Apellido</label><input type="text" id="surname2-input" maxlength="15">
                <button class="start-btn" onclick="startGame()">CONFIRMAR ALTA</button>
            </div>
        </div>

        <header>
            <div id="player-name">---</div>
            <div id="player-dni">DNI: ---</div>
            <div class="stats">
                <div>❤️ Salud: <span id="health-val">100</span>%</div>
                <div>😊 Felicidad: <span id="happiness-val">100</span>%</div>
            </div>
        </header>

        <main id="event-log"></main>

        <div id="actions-panel">
            <div class="action-row">
                <button class="action-btn" onclick="nextYear()">Cumplir año</button>
                <button class="action-btn" onclick="study()">Estudiar</button>
            </div>
            <button class="action-btn" onclick="searchJob()">Buscar trabajo</button>
            <button class="reset-btn" onclick="resetGame()">Reiniciar expediente</button>
        </div>
    </div>
    
    <script>
        let player = { name: "", dni: "", age: 0, health: 100, happiness: 100, logs: [] };

        function generateDNI() {
            let num = Math.floor(10000000 + Math.random() * 68999999);
            let letters = "TRWAGMYFPDXBNJZSQVHLCKE";
            return `${num}${letters.charAt(num % 23)}`;
        }

        function saveGame() { localStorage.setItem('sevillalife_save', JSON.stringify(player)); }

        function startGame() {
            let n = document.getElementById('name-input').value.trim();
            let s1 = document.getElementById('surname1-input').value.trim();
            let s2 = document.getElementById('surname2-input').value.trim();
            if (n === "" || s1 === "" || s2 === "") return alert("Complete los campos obligatorios.");
            player.name = `${n} ${s1} ${s2}`;
            player.dni = generateDNI();
            player.logs = ["Alta en el sistema realizada correctamente."];
            saveGame();
            document.getElementById('start-screen').style.display = 'none';
            updateUI();
            renderLogs();
        }

        function updateUI() {
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-dni').innerText = `DNI: ${player.dni}`;
        }

        function renderLogs() {
            const eventLog = document.getElementById('event-log');
            eventLog.innerHTML = "";
            player.logs.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerText = msg;
                eventLog.appendChild(div);
            });
        }

        function addLog(text) {
            player.logs.unshift(`[${player.age} años] ${text}`);
            renderLogs(); 
            saveGame();
        }

        function nextYear() { player.age++; addLog(`Ha cumplido ${player.age} años.`); }
        function study() { addLog(player.age < 6 ? "Edad insuficiente." : "Periodo de formación activo."); }
        function searchJob() { addLog(player.age < 16 ? "Menor de edad, no autorizado." : "Búsqueda de empleo iniciada."); }

        function resetGame() {
            if (confirm("¿Desea borrar todos los datos del expediente?")) {
                localStorage.removeItem('sevillalife_save'); 
                location.reload();
            }
        }

        window.onload = () => {
            let s = localStorage.getItem('sevillalife_save');
            if (s) {
                player = JSON.parse(s);
                document.getElementById('start-screen').style.display = 'none';
                updateUI();
                renderLogs();
            }
        };
    </script>
</body>
</html>
