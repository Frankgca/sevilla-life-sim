<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevillalife</title>
    <style>
        :root { color-scheme: light; }
        body {
            background-color: #FDFBF7 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
        }
        .header { text-align: center; margin-bottom: 15px; }
        .nombre { color: #A41623; font-size: 1.5em; font-weight: bold; margin-bottom: 5px; }
        .info { font-size: 0.8em; color: #666; margin-bottom: 10px; }
        
        .grid { display: flex; gap: 10px; margin-bottom: 10px; }
        .box { flex: 1; background: #FFF; padding: 10px; border-radius: 8px; border: 1px solid #E6E0D4; text-align: center; font-size: 0.85em; font-weight: bold; }
        
        .evento { background: #FFF; border-radius: 12px; padding: 15px; margin-bottom: 20px; border-left: 5px solid #C7812F; font-size: 0.95em; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        .row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 12px; background-color: #D32F2F; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .btn-full { width: 100%; padding: 12px; background-color: #D32F2F; color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .btn-outline { width: 100%; padding: 12px; background-color: white; color: #D32F2F; border: 2px solid #D32F2F; border-radius: 8px; font-weight: bold; }
        
        footer { text-align: center; margin-top: 20px; font-size: 0.75em; color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <div class="nombre">Jfkdkeldmme Kfkfklfmdlf Kfkdkkdkdkf</div>
        <div class="info">Edad: 0 años | DNI: 32865796S</div>
        <div class="grid">
            <div class="box">📚 Ninguno (Bebé)</div>
            <div class="box">💼 En paro</div>
        </div>
        <div class="grid">
            <div class="box">❤️ Salud: 100%</div>
            <div class="box">😊 Felicidad: 100%</div>
        </div>
    </div>

    <div class="evento">
        Has nacido en Sevilla. ¡Bienvenido al mundo! Tus padres te pasean en carrito por el Parque de María Luisa.
    </div>

    <div class="row">
        <button class="btn">Cumplir año</button>
        <button class="btn">Estudiar</button>
    </div>
    <button class="btn-full">Buscar trabajo</button>
    <button class="btn-outline">Reiniciar partida</button>

    <footer>© 2026 Frank. Todos los derechos reservados.</footer>

</body>
</html>
