<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sevillalife</title>
    <style>
        /* Blindaje para modo claro */
        :root {
            color-scheme: light;
        }

        body {
            background-color: #FDFBF7 !important;
            color: #000000 !important;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Resto de tus estilos */
        .header {
            background-color: #FFFFFF;
            border-top: 5px solid #A41623;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nombre {
            color: #A41623;
            font-size: 1.5em;
            font-weight: bold;
        }

        .evento {
            background-color: #FFFFFF;
            border-left: 5px solid #C7812F;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            text-align: center;
            background-color: #D32F2F;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
        }

        .btn-reiniciar {
            background-color: white;
            color: #D32F2F;
            border: 2px solid #D32F2F;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="nombre">CURRO GARCÍA SEVILLANO</div>
        <p>Edad: 0 años | DNI: 32865796S</p>
        <p>📚 Ninguno (Bebé) | 💼 En paro</p>
        <p>❤️ Salud: 100% | 😊 Felicidad: 100%</p>
    </div>

    <div class="evento">
        Has nacido en Sevilla. ¡Bienvenido al mundo! Tus padres te pasean en carrito por el Parque de María Luisa.
    </div>

    <button class="btn">Cumplir año</button>
    <button class="btn">Estudiar</button>
    <button class="btn">Buscar trabajo</button>
    <button class="btn btn-reiniciar">Reiniciar partida</button>

    <footer style="text-align: center; margin-top: 20px; font-size: 0.8em;">
        © 2026 Frank. Todos los derechos reservados.
    </footer>

</body>
</html>
