<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #game-container { 
            width: 100%; max-width: 440px; background-color: #FDFBF7; 
            display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden;
        }
        
        /* PANTALLA DE REGISTRO */
        #start-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #FDFBF7; z-index: 100; padding: 40px 20px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .form-card { 
            background: white; padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid #E5A54A; 
        }
        h1 { color: #C0392B; font-size: 1.8em; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 0.9em; margin-bottom: 25px; }
        
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.85em; color: #2c3e50; }
        input { 
            width: 100%; padding: 12px; margin-top: 6px; border: 2px solid #ecf0f1; 
            border-radius: 10px; font-size: 1em; outline: none;
        }
        input:focus { border-color: #E5A54A; }
        
        .start-btn { 
            width: 100%; margin-top: 25px; padding: 14px; background: #C0392B; 
            color: white; border: none; border-radius: 10px; cursor: pointer; 
            font-weight: bold; font-size: 1em; 
        }

        /* PANTALLA DE JUEGO (DISEÑO MEJORADO Y LIMPIO) */
        header { 
            background: #C0392B; color: white; padding: 22px 20px 16px 20px; 
            text-align: center; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        #player-name { font-size: 1.4em; font-weight: bold; margin-bottom: 4px; letter-spacing: 0.5px; }
        #player-dni { font-size: 0.8em; background: rgba(0,0,0,0.25); display: inline-block; padding: 3px 10px; border-radius: 12px; margin-bottom: 12px; font-family: monospace; }
        
        .stats { display: flex; justify-content: space-around; background: rgba(255,255,255,0.15); padding: 8px; border-radius: 10px; font-size: 0.9em; font-weight: 600; }
        
        #event-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .log-entry { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); color: #333; border-left: 4px solid #E5A54A; }
        
        /* PANEL DE ACCIONES INFERIOR UNIFICADO */
        #actions-panel { 
            display: flex; flex-direction: column; gap: 8px; padding: 15px; 
            background: white; border-top: 1px solid #eef0f2; flex-shrink: 0; 
        }
        .action-row { display: flex; gap: 10px; }
        .action-btn { flex: 1; padding: 12px; background: #2980B9; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95em; transition: opacity 0.2s; }
        .action-btn:active { opacity: 0.85; }
        .job-btn { background: #27ae60; }
        .reset-btn { width: 100%; padding: 10px; background: #C0392B; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9em; opacity: 0.9; }
        .reset-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- PANTALLA DE REGISTRO -->
        <div id="start-screen">
            <div class="form-card">
                <h1>Alta en el Padrón</h1>
                <p class="subtitle">Bienvenido a Sevilla, cuéntanos quién eres.</p>
                <label>Nombre</label>
                <input type="text" id="name-input" maxlength="15" placeholder="Curro">
                <label>Primer Apellido</label>
                <input type="text" id="surname1-input" maxlength="15" placeholder="García">
                <label>Segundo Apellido</label>
                <input type="text" id="surname2-input" maxlength="15" placeholder="Sevillano">
                <p style="font-size:0.75em; color:#95a5a6; font-style:italic; margin-top:10px;">* No es necesario que los datos sean reales.</p>
                <button class="start-btn" onclick="startGame()">Comenzar mi historia</button>
            </div>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <header>
            <div id="player-name">---</div>
            <div id="player-dni">DNI: ---</div>
            <div class="stats">
                <div>❤️ <span id="health-val">100</span>%</div>
                <div>😊 <span id="happiness-val">100</span>%</div>
            </div>
        </header>

        <main id="event-log"></main>

        <!-- PANEL DE ACCIONES -->
        <div id="actions-panel">
            <div class="action-row">
                <button class="action-btn" onclick="study()">Estudiar</button>
                <button class="action-btn job-btn" onclick="searchJob()">Buscar trabajo</button>
            </div>
            <button class="reset-btn" onclick="resetGame()">Reiniciar partida</button>
        </div>
    </div>
    
    <script>
        let player = { name: "", dni: "", age: 0, health: 100, happiness: 100, logs: [] };

        function generateDNI() {
            let num = Math.floor(10000000 + Math.random() * 68999999);
            let letters = "TRWAGMYFPDXBNJZSQVHLCKE";
            return `${num}${letters.charAt(num % 23)}`;
        }

        function startGame() {
            let n = document.getElementById('name-input').value.trim();
            let s1 = document.getElementById('surname1-input').value.trim();
            let s2 = document.getElementById('surname2-input').value.trim();
            
            if (n === "" || s1 === "" || s2 === "") { alert("¡Rellena todo, mi arma!"); return; }
            
            player.name = `${n} ${s1} ${s2}`;
            player.dni = generateDNI();
            player.health = 100;
            player.happiness = 100;
            player.age = 0;
            player.logs = ["Has nacido en Sevilla. ¡Bienvenido al mundo!"];
            
            document.getElementById('start-screen').style.display = 'none';
            updateUI();
            renderLogs();
            saveGame();
        }

        function saveGame() { localStorage.setItem('sevillalife_save', JSON.stringify(player)); }

        function updateUI() {
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('player-dni').innerText = `DNI: ${player.dni}`;
            document.getElementById('health-val').innerText = player.health;
            document.getElementById('happiness-val').innerText = player.happiness;
        }

        function addLog(text) {
            player.logs.unshift(`[${player.age} años] ${text}`);
            renderLogs(); 
            saveGame();
        }

        function renderLogs() {
            const eventLog = document.getElementById('event-log');
            eventLog.innerHTML = "";
            player.logs.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerText = msg;
                eventLog.appendChild(div);
            });
        }

        function study() {
            if (player.age < 6) {
                addLog(`Eres un niño pequeño, ¡sal a jugar por el barrio! Te faltan ${6 - player.age} años para estudiar.`);
            } else {
                addLog("Estás formándote para el futuro en Sevilla.");
            }
        }

        function searchJob() {
            if (player.age < 16) {
                addLog(`¡Aún eres menor de edad (${player.age} años)! Tienes que estudiar antes de buscar un trabajo.`);
            } else {
                addLog("Has estado mirando ofertas de empleo por Sevilla.");
            }
        }

        function resetGame() {
            if (confirm("¿Seguro que quieres reiniciar la partida?")) {
                localStorage.removeItem('sevillalife_save'); 
                location.reload();
            }
        }

        window.onload = () => {
            let s = localStorage.getItem('sevillalife_save');
            if (s) { 
                try {
                    player = JSON.parse(s);
                    if (!player.name || player.name.trim() === "") {
                        localStorage.removeItem('sevillalife_save');
                        return;
                    }
                    document.getElementById('start-screen').style.display = 'none'; 
                    updateUI(); 
                    renderLogs(); 
                } catch(e) {
                    localStorage.removeItem('sevillalife_save');
                }
            }
        };
    </script>
</body>
</html>
