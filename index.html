<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sevillalife</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background-color: #FDFBF7; font-family: sans-serif; height: 100vh; overflow: hidden; }
        
        #game-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        
        /* Pantalla de Registro */
        #start-screen { display: flex; flex-direction: column; justify-content: center; padding: 20px; height: 100%; }
        .form-card { background: white; padding: 20px; border-radius: 15px; border-top: 5px solid #E5A54A; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; }
        
        /* Pantalla de Juego */
        #main-ui { display: none; flex-direction: column; height: 100%; }
        header { background: #C0392B; color: white; padding: 15px; text-align: center; flex-shrink: 0; }
        
        #event-log { flex-grow: 1; overflow-y: auto; padding: 15px; background: #FDFBF7; }
        .log-entry { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border-left: 4px solid #2980B9; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        /* Panel de botones */
        .controls { padding: 15px; background: white; border-top: 2px solid #eee; flex-shrink: 0; }
        button { width: 100%; padding: 14px; margin-top: 5px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <div class="form-card">
            <h1>Alta en el Padrón</h1>
            <input type="text" id="name-input" placeholder="Nombre">
            <input type="text" id="surname1-input" placeholder="1er Apellido">
            <input type="text" id="surname2-input" placeholder="2do Apellido">
            <button onclick="startGame()" style="background:#C0392B; color:white;">Comenzar</button>
        </div>
    </div>

    <div id="main-ui">
        <header>
            <h2 id="display-name" style="margin:0;">---</h2>
            <div id="display-dni" style="font-size:0.8em;">---</div>
        </header>
        <div id="event-log"></div>
        <div class="controls">
            <button onclick="study()" style="background:#2980B9; color:white;">Estudiar</button>
            <button onclick="resetGame()" style="background:#ff7675; color:white;">Reiniciar</button>
        </div>
    </div>
</div>

<script>
    let player = { name: "", dni: "", logs: [] };

    window.onload = () => {
        const saved = localStorage.getItem('sevillalife_data');
        if (saved) {
            player = JSON.parse(saved);
            renderGame();
        }
    };

    function startGame() {
        const n = document.getElementById('name-input').value.trim();
        const s1 = document.getElementById('surname1-input').value.trim();
        const s2 = document.getElementById('surname2-input').value.trim();
        if (!n || !s1 || !s2) return alert("Rellena todo, mi arma.");
        player.name = `${n} ${s1} ${s2}`;
        player.dni = "DNI: " + Math.floor(Math.random()*100000000) + "TRWAGMYFPDXBNJZSQVHLCKE"[Math.floor(Math.random()*23)];
        player.logs = ["Has empezado tu vida en Sevilla."];
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('sevillalife_data', JSON.stringify(player));
        renderGame();
    }

    function renderGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('main-ui').style.display = 'flex';
        document.getElementById('display-name').innerText = player.name;
        document.getElementById('display-dni').innerText = player.dni;
        document.getElementById('event-log').innerHTML = player.logs.map(l => `<div class="log-entry">${l}</div>`).join('');
    }

    function study() {
        player.logs.unshift("Estudias un poco más.");
        saveAndRefresh();
    }

    function resetGame() {
        localStorage.removeItem('sevillalife_data');
        location.reload();
    }
</script>
</body>
</html>
